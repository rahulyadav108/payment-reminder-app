<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard | PaymentLoo</title>
  <style>
    body {
      background: linear-gradient(to right, #43e97b, #38f9d7);
      font-family: 'Segoe UI', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .dashboard {
      background: white;
      padding: 40px;
      border-radius: 10px;
      box-shadow: 0px 5px 20px rgba(0,0,0,0.2);
      width: 350px;
      text-align: center;
    }
    .dashboard h2 {
      margin-bottom: 20px;
      color: #00897b;
    }
    .dashboard p {
      font-size: 16px;
      margin: 10px 0;
      font-weight: bold;
    }
    .dashboard button {
      padding: 10px 25px;
      background-color: #00897b;
      color: white;
      border: none;
      border-radius: 5px;
      font-size: 15px;
      cursor: pointer;
    }
    .dashboard button:hover {
      background-color: #00695c;
    }
  </style>
</head>
<body>
  <div class="dashboard">
    <h2>Welcome to PaymentLoo</h2>
    <p id="user-email">Verifying...</p>
    <button onclick="logout()">Logout</button>
  </div>
