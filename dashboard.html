    .dashboard-box {
      background: white;

    }
    .dashboard-box h2 {

    }
    .dashboard-box p {
      margin: 10px 0;
      font-weight: bold;
    }
    .dashboard-box button {
      padding: 10px 20px;
      background-color: #e53935;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    .dashboard-box button:hover {

    }
