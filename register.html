<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Register - PaymentLoo</title>
  <style>
    body { font-family: Arial; background: #e3f2fd; display: flex; justify-content: center; align-items: center; height: 100vh; }
    .container { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
    input, button { width: 100%; padding: 10px; margin: 10px 0; }
    .google-btn { background: #DB4437; color: white; border: none; }
  </style>
</head>
<body>
  <div class="container">
    <h2>Register for PaymentLoo</h2>
    <input type="email" id="register-email" placeholder="Email" />
    <input type="password" id="register-password" placeholder="Password" />
    <button onclick="register()">Register</button>
    <button class="google-btn" onclick="googleLogin()">Continue with Google</button>
    <p>Already have an account? <a href="index.html">Login</a></p>
  </div>

  <script src="https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/11.6.1/firebase-analytics.js"></script>
  <script src="frontend/app.js"></script>
</body>
</html>
