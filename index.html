<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>PaymentLoo - Payment Reminder App</title>
  <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-database.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 600px;
      margin: auto;
      padding: 20px;
    }
    input, button {
      display: block;
      margin: 10px 0;
      padding: 10px;
      width: 100%;
    }
    h2 {
      margin-top: 40px;
    }
  </style>
</head>
<body>
  <h1>Welcome to PaymentLoo</h1>

  <h2>Login</h2>
  <input type="email" id="loginEmail" placeholder="Email">
  <input type="password" id="loginPassword" placeholder="Password">
  <button onclick="login()">Login</button>

  <script>
  // For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyD4rUpC-Y7m1hGwKydLjTN4hnH4PUejF-0",
  authDomain: "paymentloo.firebaseapp.com",
  projectId: "paymentloo",
  storageBucket: "paymentloo.firebasestorage.app",
  messagingSenderId: "678382986235",
  appId: "1:678382986235:web:14d671959c28ec800a215e",
  measurementId: "G-33XCH79XP2"
};

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.database();

    function login() {
      const email = document.getElementById("loginEmail").value;
      const password = document.getElementById("loginPassword").value;
      auth.signInWithEmailAndPassword(email, password)
        .then(() => alert("Logged in Successfully"))
        .catch(err => alert(err.message));
    }

    function addDebtor() {
      const user = auth.currentUser;
      if (!user) return alert("Please login first");

      const debtorName = document.getElementById("debtorName").value;
      const debtorPhone = document.getElementById("debtorPhone").value;
      const debtorAmount = document.getElementById("debtorAmount").value;
      const dueDate = document.getElementById("dueDate").value;

      const ref = db.ref("users/" + user.uid + "/debtors");
      ref.push({
        name: debtorName,
        phone: debtorPhone,
        amount: debtorAmount,
        dueDate: dueDate
      }).then(() => alert("Debtor Added Successfully"))
        .catch(err => alert(err.message));
    }
    <script type="module" src="frontend/app.js"></script>
  </script>
</body>
</html>
