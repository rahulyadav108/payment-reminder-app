<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login | PaymentLoo</title>
  <style>
    body {
      background: linear-gradient(to right, #00c6ff, #0072ff);
      font-family: 'Segoe UI', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .container {
      background: white;
      padding: 40px 30px;
      border-radius: 10px;
      box-shadow: 0px 5px 20px rgba(0,0,0,0.2);
      width: 320px;
    }
    .container h2 {
      text-align: center;
      color: #0072ff;
      margin-bottom: 25px;
    }
    .container input {
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      border: 1px solid #ccc;
      border-radius: 5px;
    }
    .container button {
      width: 100%;
      padding: 12px;
      background-color: #0072ff;
      color: white;
      border: none;
      border-radius: 5px;
      margin-top: 10px;
      font-size: 16px;
    }
    .container button:hover {
      background-color: #005ecb;
    }
    .container p {
      text-align: center;
      margin-top: 15px;
    }
    .container a {
      color: #0072ff;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Login to PaymentLoo</h2>
    <input type="email" id="login-email" placeholder="Email" required />
    <input type="password" id="login-password" placeholder="Password" required />
    <button onclick="login()">Login</button>
    <p>New user? <a href="register.html">Register here</a></p>
  </div>
