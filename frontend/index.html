<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>PaymentLoo - Payment Reminder App</title>
  <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-database.js"></script>
  <script defer src="app.js"></script>
</head>
<body>
  <h1>Welcome to PaymentLoo</h1>

  <h2>Register</h2>
  <input type="email" id="registerEmail" placeholder="Email">
  <input type="password" id="registerPassword" placeholder="Password">
  <button onclick="register()">Register</button>

  <h2>Login</h2>
  <input type="email" id="loginEmail" placeholder="Email">
  <input type="password" id="loginPassword" placeholder="Password">
  <button onclick="login()">Login</button>

  <h2>Add Debtor</h2>
  <input type="text" id="debtorName" placeholder="Debtor Name">
  <input type="text" id="debtorPhone" placeholder="Debtor Phone">
  <input type="number" id="debtorAmount" placeholder="Amount Due">
  <input type="date" id="dueDate" placeholder="Due Date">
  <button onclick="addDebtor()">Add Debtor</button>
  
  <script type="module" src="frontend/app.js"></script>
</body>
</html>
